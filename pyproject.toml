[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-gtw"
version = "0.2.1"
description = "Local PII/PHI data-access guardrails and MCP tools for coding agents"
keywords = ["coding-agents", "privacy", "pii", "phi", "mcp", "agent-skills", "codex", "claude-code", "jev"]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/d0ng231/jev-gtw"
Documentation = "https://github.com/d0ng231/jev-gtw/blob/main/docs/INTEGRATIONS.md"
Repository = "https://github.com/d0ng231/jev-gtw"
Issues = "https://github.com/d0ng231/jev-gtw/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
dev = ["mcp>=1.26,<2", "build>=1", "PyYAML>=6", "Pillow>=11"]

[project.scripts]
jev-gtw = "jev_gtw.cli:main"

[tool.setuptools.packages.find]
include = ["jev_gtw*"]

