<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title description">
  <title id="title">JEV Gateway architecture: reviewed observations for coding agents</title>
  <desc id="description">A coding agent requests source handles or submits probe code through guarded MCP tools. The operator controls policy and the source registry. The release gate checks source permissions, approved content hashes and optionally a local 0.8B JEV model. Only admitted text or images, or fixed withholding feedback, return to the agent. Authorized local probes run in an isolated sandbox, with captured output reviewed again and saved artifacts kept private.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8291"/></marker>
    <marker id="returnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f76"/></marker>
  </defs>
  <rect width="1120" height="660" rx="20" fill="#f5f8fb"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#172e3d">
    <text x="36" y="49" font-size="29" font-weight="700">One boundary before data enters agent context</text>
    <text x="36" y="81" font-size="18" fill="#536a7b">Text and images · operator-owned permissions · local inference · no training</text>

    <rect x="290" y="150" width="794" height="449" rx="16" fill="#ffffff" stroke="#b9cbd7" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="310" y="178" font-size="13" font-weight="700" fill="#536a7b" letter-spacing="1.2">GATEWAY HOST / PROTECTED STORAGE</text>

    <rect x="700" y="110" width="332" height="88" rx="12" fill="#e8f5f1" stroke="#8ebfb4"/>
    <text x="720" y="136" font-size="12" font-weight="700" fill="#087f76" letter-spacing="1.3">TRUSTED OPERATOR</text>
    <text x="720" y="163" font-size="19" font-weight="700">Task · policy · recipient</text>
    <text x="720" y="186" font-size="16" fill="#536a7b">Source registry and approved hashes</text>

    <rect x="36" y="245" width="210" height="155" rx="14" fill="#173a49"/>
    <text x="56" y="276" font-size="12" font-weight="700" fill="#9ed8d2" letter-spacing="1.5">CODING AGENT</text>
    <text x="56" y="315" font-size="25" font-weight="700" fill="#ffffff">Codex</text>
    <text x="56" y="348" font-size="25" font-weight="700" fill="#ffffff">Claude Code</text>
    <text x="56" y="379" font-size="16" fill="#c3dce5">or another MCP client</text>

    <rect x="330" y="245" width="228" height="155" rx="14" fill="#f1f5f9" stroke="#ccd9e2"/>
    <text x="350" y="279" font-size="22" font-weight="700">Guarded tools</text>
    <text x="350" y="314" font-size="16">read · compute · sources</text>
    <text x="350" y="346" font-size="17" fill="#536a7b">Registered source IDs</text>
    <text x="350" y="374" font-size="17" fill="#536a7b">or local probe code</text>

    <rect x="700" y="245" width="332" height="155" rx="14" fill="#e8f5f1" stroke="#087f76" stroke-width="1.5"/>
    <text x="720" y="279" font-size="24" font-weight="700">JEV release gate</text>
    <text x="720" y="315" font-size="17">Source caps + exact public hashes</text>
    <text x="720" y="346" font-size="17">Optional 0.8B permission check</text>
    <text x="720" y="375" font-size="17" font-weight="700" fill="#087f76">Validate the admitted bytes</text>

    <rect x="330" y="470" width="228" height="110" rx="14" fill="#f2effb" stroke="#d1c8eb"/>
    <text x="350" y="501" font-size="22" font-weight="700">Local sandbox</text>
    <text x="350" y="530" font-size="17" fill="#536a7b">Read-only input files</text>
    <text x="350" y="557" font-size="17" fill="#536a7b">Network disabled</text>

    <rect x="700" y="470" width="332" height="110" rx="14" fill="#f1f5f9" stroke="#ccd9e2"/>
    <text x="720" y="502" font-size="23" font-weight="700">Private artifacts</text>
    <text x="720" y="532" font-size="17" fill="#536a7b">Saved on the gateway host</text>
    <text x="720" y="558" font-size="17" fill="#536a7b">Agent receives an opaque receipt</text>

    <g fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)">
      <path d="M246 322 H330"/>
      <path d="M558 322 H700"/>
      <path d="M930 198 V245"/>
      <path d="M444 400 V470"/>
      <path d="M558 505 H650 V365 H700"/>
      <path d="M558 550 H700"/>
    </g>
    <path d="M780 245 V218 H141 V245" fill="none" stroke="#087f76" stroke-width="2.5" marker-end="url(#returnArrow)"/>
    <rect x="319" y="202" width="371" height="27" rx="5" fill="#ffffff"/>
    <text x="504" y="221" text-anchor="middle" font-size="16" fill="#087f76" font-weight="700">Admitted content or fixed feedback</text>
    <text x="288" y="307" text-anchor="middle" font-size="15" fill="#536a7b">request</text>
    <text x="629" y="307" text-anchor="middle" font-size="16" fill="#536a7b">review</text>
    <text x="461" y="440" font-size="16" fill="#536a7b">authorized probe</text>
    <text x="606" y="463" text-anchor="middle" font-size="15" fill="#536a7b">stdout</text>
    <text x="606" y="484" text-anchor="middle" font-size="15" fill="#536a7b">+ stderr</text>
    <text x="629" y="542" text-anchor="middle" font-size="16" fill="#536a7b">save</text>

    <text x="36" y="634" font-size="17" fill="#536a7b">Protected storage must be inaccessible through the agent's other tools. A skill guides use; the host enforces access.</text>
  </g>
</svg>
